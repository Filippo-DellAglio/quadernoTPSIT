<html>
    <head>
        <title>SPA gatti casuali</title>
        
        <!--css-->
        <style>
            .contenitore-gatto-casuale
            {
                text-align: center;
            }

            #gatto-casuale
            {
                height: 400px;
                width: auto;
            }

            .btn
            {
                font-size: 24px;
                background: plum;
                border: 1px solid #2a2a2a;
                border-radius: 4px;
                padding: 6px;
                margin: 10px;
            }

            #contenitore-bottoni
            {
                display: flex;
                justify-content: center;
            }

            #gatti-salvati
            {
                margin: 50px;
                border: 5px solid #2a2a2a;
                display: flex;
                justify-content: space-around;
                flex-wrap: wrap;
            }

            #gatti-salvati img
            {
                height: 170px;
                margin: 15px;
            }
        </style>

    </head>
    <body>
        <!--HTML-->
        <div id="contenitore-bottoni">
            <button id="btn-ricarica" class="btn">Nuovo gatto</button>
            <button id="btn-salva" class="btn">Salva</button>
        </div>
        

        <div class="contenitore-gatto-casuale">
            <img id="gatto-casuale" src="" alt="">
        </div>
        

        <div id="gatti-salvati">

        </div>


        <!--JavaScript-->
        <script>
            const imgGattoCasuale= document.getElementById("gatto-casuale");
            const btnRicarica= document.getElementById("btn-ricarica");
            const btnSalva= document.getElementById("btn-salva");
            const divGattiSalvati=document.getElementById("gatti-salvati")

            async function getRandomCat()
            {
                const url="https://cataas.com/cat?json=true";
                const response=await fetch(url);
                if(response.ok)
                {
                    const body=await response.json();
                    console.log(body);
                    imgGattoCasuale.src=body.url;
                }
            }
            btnRicarica.addEventListener("click",getRandomCat);

            function salvaGatto()
            {
                const nuovoImg=document.createElement("img");
                nuovoImg.src=imgGattoCasuale.src;
                divGattiSalvati.append(nuovoImg); //oppure divGattiSalvati.appendChild(nuovoImg);
            }

            btnSalva.addEventListener("click", salvaGatto);
        </script>
    </body>
</html>
